{% extends 'assets/base.html %}

{% block content%}

<section class="relative flex-1 flex items-center justify-center overflow-hidden">
  <div class="absolute inset-0 chart-grid pointer-events-none"></div>

  <div class="relative max-w-lg mx-auto px-5 py-20 text-center">
    <div class="w-40 h-40 mx-auto mb-8">
      <svg viewBox="0 0 200 200" class="w-full h-full">
        <circle cx="100" cy="100" r="92" fill="none" stroke="#E7DEC7" stroke-opacity="0.25" stroke-width="1"/>
        <circle cx="100" cy="100" r="70" fill="none" stroke="#E7DEC7" stroke-opacity="0.2" stroke-width="1"/>
        <g stroke="#E7DEC7" stroke-opacity="0.35" stroke-width="1">
          <line x1="100" y1="8" x2="100" y2="24"/><line x1="100" y1="176" x2="100" y2="192"/>
          <line x1="8" y1="100" x2="24" y2="100"/><line x1="176" y1="100" x2="192" y2="100"/>
        </g>
        <text x="100" y="20" fill="#D3A75C" font-family="IBM Plex Mono" font-size="9" text-anchor="middle">N</text>
        <g class="compass-needle">
          <polygon points="100,40 108,100 100,110 92,100" fill="#C08A3E"/>
          <polygon points="100,160 108,100 100,90 92,100" fill="#F2ECDC" fill-opacity="0.5"/>
        </g>
        <circle cx="100" cy="100" r="4.5" fill="#FBF8F1"/>
      </svg>
    </div>

    <p class="font-mono text-xs tracking-[0.2em] text-brass-400 mb-3">ERROR 404</p>
    <h1 class="font-display font-bold text-3xl sm:text-4xl mb-4">You've sailed off the map.</h1>
    <p class="text-paper-100/65 leading-relaxed mb-9">
      This page doesn't exist, or it's moved somewhere we haven't charted yet. Let's get you back on route.
    </p>

    <div class="flex flex-wrap items-center justify-center gap-4">
      <a href="index.html" class="btn btn-brass px-7 py-3.5 text-sm">Back to home</a>
      <a href="products.html" class="btn btn-outline px-7 py-3.5 text-sm">Browse the fleet</a>
    </div>
  </div>
</section>

{% endblock content %}
